<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90"
     role="img" aria-label="Spark IoT Kit">
  <title>Spark IoT Kit</title>
  <!-- Compact hardware silhouette, microbit-illustration sized (~120×90) so
       Scratch's connection modal scales + frames it consistently with sibling
       extensions. Background, label, and decorative elements are owned by the
       modal — keep this asset to the kit silhouette only. -->
  <defs>
    <linearGradient id="spkBoardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243349"/>
      <stop offset="100%" stop-color="#1A2436"/>
    </linearGradient>
    <radialGradient id="spkRedLit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spkYellowLit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD93D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dev board: 96×56 centered around (60, 50) -->
  <g transform="translate(12 22)">
    <rect x="0" y="0" width="96" height="56" rx="6" fill="url(#spkBoardGrad)" stroke="#0F1722" stroke-width="1.2"/>

    <!-- USB-C jack on top edge -->
    <rect x="40" y="-3" width="16" height="5" rx="1" fill="#0F1722"/>

    <!-- Two LEDs (red + yellow) -->
    <circle cx="56" cy="22" r="5"   fill="#FF6B6B" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="56" cy="22" r="1.6" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="74" cy="22" r="5"   fill="#FFD93D" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="74" cy="22" r="1.6" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Two push buttons -->
    <g>
      <rect x="11" y="17" width="11" height="11" rx="1.5" fill="#3D5273" stroke="#0F1722" stroke-width="0.8"/>
      <circle cx="16.5" cy="22.5" r="3"   fill="#5C7BA8"/>
      <circle cx="16.5" cy="22.5" r="1.2" fill="#7B97C2"/>
    </g>
    <g>
      <rect x="25" y="17" width="11" height="11" rx="1.5" fill="#3D5273" stroke="#0F1722" stroke-width="0.8"/>
      <circle cx="30.5" cy="22.5" r="3"   fill="#5C7BA8"/>
      <circle cx="30.5" cy="22.5" r="1.2" fill="#7B97C2"/>
    </g>

    <!-- Buzzer (right) -->
    <circle cx="82" cy="44" r="6.5" fill="#3D5273" stroke="#0F1722" stroke-width="0.8"/>
    <circle cx="82" cy="44" r="3.5" fill="#1A2436"/>
    <circle cx="82" cy="44" r="1.4" fill="#5C7BA8"/>

    <!-- IMU chip -->
    <rect x="11" y="38" width="9" height="9" rx="1" fill="#0F1722"/>
    <circle cx="13" cy="40" r="0.8" fill="#FFD93D"/>

    <!-- Decorative traces -->
    <g stroke="#36465E" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M 22 28 L 22 38"/>
      <path d="M 36 28 L 36 38 L 64 38"/>
      <path d="M 64 27 L 64 33 L 72 33 L 72 27"/>
      <path d="M 76 44 L 67 44"/>
    </g>
  </g>

  <!-- LED glows over the board with screen blend -->
  <g style="mix-blend-mode: screen">
    <circle cx="68" cy="44" r="13" fill="url(#spkRedLit)"/>
    <circle cx="86" cy="44" r="13" fill="url(#spkYellowLit)"/>
  </g>
</svg>
