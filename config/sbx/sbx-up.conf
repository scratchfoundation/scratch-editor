# sbx-template: sbx-up.conf 0.1.2
# Project requirements checked by config/sbx/bin/sbx-up. KEY=VALUE lines; the
# file is parsed, not sourced. Each requirement has a section in REFERENCE.md.

# Sandbox-scoped secrets that must be stored before the sandbox starts.
# `github` is a fine-grained token for this repository. Storing your host's
# `gh auth token` instead works, but gives the sandbox your whole GitHub
# account; REFERENCE.md "GitHub token" explains why that is dangerous.
REQUIRED_SECRETS=github

# Minimum sandbox.disk.dockerVolume, e.g. 50g. Empty: the 10g default is enough.
MIN_DOCKER_VOLUME=

# Extra paths to mount read-only and guard in direct mode, space-separated.
# config/sbx (with the global mixin) and sbxenv.yaml are always protected.
PROTECT=
