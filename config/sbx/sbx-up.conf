# sbx-template: sbx-up.conf 0.1.0
# Project requirements checked by config/sbx/bin/sbx-up. KEY=VALUE lines; the
# file is parsed, not sourced. Each requirement has a section in README.md.

# Sandbox-scoped secrets that must be stored before the sandbox starts.
REQUIRED_SECRETS=github

# Minimum sandbox.disk.dockerVolume, e.g. 50g. Empty: the 10g default is enough.
MIN_DOCKER_VOLUME=

# Extra paths to mount read-only and guard in direct mode, space-separated.
# config/sbx (with the company mixin) and sbxenv.yaml are always protected.
PROTECT=
