name: Test Packages

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON array of package names to test'
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    name: Test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build
          path: packages
      - uses: ./.github/actions/test-package
        with:
          package_name: ${{ matrix.package }}

  results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # Download every per-package test-output artifact. Each lands
          # in its own subdirectory (e.g. scratch-gui-test-output/),
          # which avoids filename collisions between packages that both
          # produce junit.xml.
          pattern: '*-test-output'
          path: test-results
      - name: Publish test reports
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          # Every test reporter in this repo produces JUnit XML.
          # Restricting to *.xml avoids the action trying to parse
          # directories and non-test artifacts (Playwright HTML
          # reports, traces, screenshots, etc.) as test result files.
          files: test-results/**/*.xml
          check_name: "Test Results"
      - name: Check test outcome
        run: |
          case "${{ needs.test.result }}" in
            success)
              echo "Tests passed successfully."
              exit 0
              ;;
            cancelled)
              echo "Tests were cancelled."
              exit 1
              ;;
            *)
              echo "Tests failed. Result: ${{ needs.test.result }}"
              exit 1
              ;;
          esac
