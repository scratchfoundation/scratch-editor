name: deploy-uat

on:
  push:
    branches: [uat]
  workflow_dispatch: {}

concurrency:
  group: uat-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/warutc/scratch-editor:uat
            ghcr.io/warutc/scratch-editor:${{ steps.vars.outputs.sha }}

      - name: Deploy over SSH (forced command)
        env:
          UAT_HOST: ${{ vars.UAT_HOST }}
          UAT_USER: ${{ vars.UAT_USER }}
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/uat_key
          chmod 600 ~/.ssh/uat_key
          ssh-keyscan -H "$UAT_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/uat_key -o IdentitiesOnly=yes \
            "$UAT_USER@$UAT_HOST" "deploy ${{ steps.vars.outputs.sha }}"
